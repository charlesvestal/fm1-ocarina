# OCA-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "OCA"                   # the build's files: oca.fwsc, oca-X.Y.fwsc
id_prefix = "FM-1_14"          # package identity: dev FM-1_1400, releases FM-1_14XXYYZZ
usb_manufacturer = "OCA-1"
usb_product = "OCA-1 FM-1"
ble = false                    # an instrument for the room: no radio
mirror = true                  # the screen and panel on a computer (base web/mirror, tools/fm1_mirror.py)
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/oca.c"]             # the voice, at -O2
# the site
tagline = "an ocarina for the FM-1, for games that listen"
repo = "https://github.com/charlesvestal/fm1-ocarina"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "Charles Vestal"
description = "OCA-1 turns the M-VAVE FM-1 into an ocarina for games that listen. It plays one clear note at a time, so the Nintendo Switch 2 version of Ocarina of Time hears your songs through the console's microphone. The songbook has the game's twelve songs: the keys you need light up in turn, PLAY plays a song for you, and OCA-1 names each song you finish."
tags = ["synth"]
install = "https://charlesvestal.github.io/fm1-ocarina/install/"
site = "https://charlesvestal.github.io/fm1-ocarina/"
screenshot = "app/docs/img/screen-playing.png"
